name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Unit Tests ──────────────────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r app/requirements.txt pytest-cov

      - name: Run tests with coverage
        run: pytest app/tests/ -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ── 2. Build Docker Image ──────────────────────────────────────────────────
  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t logguard-app:${{ github.sha }} ./app

      - name: Save image for scanning
        run: docker save logguard-app:${{ github.sha }} | gzip > logguard-app.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: logguard-app.tar.gz

  # ── 3. Trivy Security Scan (report only, does not block) ───────────────────
  trivy:
    name: Trivy Security Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < logguard-app.tar.gz

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: logguard-app:${{ github.sha }}
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ── 4. Push to Docker Hub + Update k8s manifest ────────────────────────────
  push-and-deploy:
    name: Push Image & Update Manifest
    needs: [build, trivy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < logguard-app.tar.gz

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push to Docker Hub
        run: |
          docker tag logguard-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/logguard-app:${{ github.sha }}
          docker tag logguard-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/logguard-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/logguard-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/logguard-app:latest

      - name: Update k8s deployment image tag
        run: |
          sed -i "s|image: .*/logguard-app:.*|image: ${{ secrets.DOCKER_USERNAME }}/logguard-app:${{ github.sha }}|" k8s/app/deployment.yml

      - name: Commit updated manifest
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add k8s/app/deployment.yml
          git diff --staged --quiet || git commit -m "ci: update app image to ${{ github.sha }}"
          git push
